name: Monthly Report

# Auto-generates /blog/diamond-news-YYYY-MM.html on the 1st of each month
# at 02:00 UTC (10:00 Taipei). Pulls Google News RSS, runs the full build
# chain (OG image, sitemap, schema), commits, pushes, then pings IndexNow
# so Bing/Yandex see the new article within hours.
#
# Runs on schedule + manual workflow_dispatch (so you can trigger from the
# Actions tab anytime).

on:
  schedule:
    - cron: '0 2 1 * *'      # 02:00 UTC, 1st day, every month
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM (leave blank for current month)'
        required: false
        default: ''

permissions:
  contents: write             # needed for the bot to push the new file

concurrency:
  group: monthly-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history so sync_datemodified.py can read git log

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (for OG image)
        run: pip install --quiet pillow

      - name: Generate monthly report
        env:
          REPORT_MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -n "$REPORT_MONTH" ]; then
            python build/scripts/build_monthly_report.py --month "$REPORT_MONTH"
          else
            python build/scripts/build_monthly_report.py
          fi

      - name: Build OG image (uses CJK font from setup step)
        run: |
          # GitHub Actions Ubuntu has Noto CJK fonts pre-installed; symlink to
          # the path build_og_images.py expects (it defaults to Windows paths).
          mkdir -p /tmp/winfonts
          # Find any Noto CJK or fallback to a default
          FONT=$(fc-match -f "%{file}" "Noto Sans CJK TC:bold")
          ln -sf "$FONT" /tmp/winfonts/msjhbd.ttc
          FONT=$(fc-match -f "%{file}" "Noto Sans CJK TC:regular")
          ln -sf "$FONT" /tmp/winfonts/msjh.ttc
          # Patch script paths in-place for this CI run only (don't commit)
          sed -i "s|C:/Windows/Fonts/msjhbd.ttc|/tmp/winfonts/msjhbd.ttc|g" build/scripts/build_og_images.py
          sed -i "s|C:/Windows/Fonts/msjh.ttc|/tmp/winfonts/msjh.ttc|g" build/scripts/build_og_images.py
          python build/scripts/build_og_images.py
          # Restore the file so the diff is clean
          git checkout -- build/scripts/build_og_images.py

      - name: Re-sync sitemaps + schemas
        run: |
          python build/scripts/build_sitemap_split.py
          python build/scripts/build_image_sitemap.py
          python build/scripts/inject_seo_essentials.py
          python build/scripts/inject_author_schema.py
          python build/scripts/sync_datemodified.py

      - name: Validate
        run: |
          python build/scripts/check_js.py
          python build/scripts/audit_canonicals.py

      - name: Commit + push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          MONTH=${REPORT_MONTH:-$(date +%Y-%m)}
          git add blog/diamond-news-*.html og/diamond-news-*.png \
                  sitemap*.xml og-sitemap.xml robots.txt blog/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto: monthly report for $MONTH

          🤖 Generated by build_monthly_report.py via cron.
          Editor: please fill in the 4 「編輯觀點」TODO blocks
          before sharing externally."
          git push
        env:
          REPORT_MONTH: ${{ github.event.inputs.month }}

      - name: Ping IndexNow
        continue-on-error: true     # never fail the run because of an external API
        run: |
          MONTH=${REPORT_MONTH:-$(date +%Y-%m)}
          python build/scripts/ping_indexnow.py "/blog/diamond-news-$MONTH"
        env:
          REPORT_MONTH: ${{ github.event.inputs.month }}

      - name: Open issue with TODO reminder
        uses: actions/github-script@v7
        with:
          script: |
            const month = process.env.REPORT_MONTH || new Date().toISOString().slice(0,7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `📰 Fill commentary in monthly report ${month}`,
              body:  `The auto-generated report at \`/blog/diamond-news-${month}\` has 4 「編輯觀點」TODO blocks.\n\nEdit and re-deploy when you've added analysis.`,
              labels: ['monthly-report', 'editorial']
            });
        env:
          REPORT_MONTH: ${{ github.event.inputs.month }}
